name: MOLIDO PHONE AI - Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Verify project
        run: |
          echo "=== Project root ==="
          ls -la
          echo "=== App module ==="
          test -f app/build.gradle
          echo "app/build.gradle found"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: molido-phone-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
